# SPDX-License-Identifier: Apache-2.0
[package]
name = "oti-engine"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "Deterministic transit diagram geometry engine"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
profiling = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
